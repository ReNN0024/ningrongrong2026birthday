name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git' --exclude='.github' --exclude='*.md' --exclude='preview-all-results.html' --exclude='generate-coordinate-bg.html'
          path: ./
          remote_path: /var/www/html/
          remote_host: 115.191.2.56
          remote_user: root
          remote_port: 22
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
