name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create directories on server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no root@115.191.2.56 "mkdir -p /var/www/html/assets/logos /var/www/html/assets/detail-images /var/www/html/assets/share-card-figures"

      - name: Deploy to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git' --exclude='.github' --exclude='*.md' --exclude='*.png' --exclude='preview-all-results.html' --exclude='generate-coordinate-bg.html'
          path: ./
          remote_path: /var/www/html/
          remote_host: 115.191.2.56
          remote_user: root
          remote_port: 22
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_key_pass: ''
