<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      .axis { stroke: #666666; stroke-width: 3; fill: none; }
      .center-dot { fill: white; stroke: #666666; stroke-width: 3; }
      .title { font-family: "Microsoft YaHei", "SimHei", sans-serif; font-size: 48px; fill: #333333; font-weight: bold; }
      .subtitle { font-family: "Microsoft YaHei", "SimHei", sans-serif; font-size: 24px; fill: #666666; }
      .corner-title { font-family: "Microsoft YaHei", "SimHei", sans-serif; font-size: 28px; fill: #444444; }
      .corner-subtitle { font-family: "Microsoft YaHei", "SimHei", sans-serif; font-size: 20px; fill: #888888; }
    </style>
  </defs>
  
  <!-- 坐标轴 -->
  <line x1="130" y1="540" x2="950" y2="540" class="axis"/>
  <line x1="540" y1="130" x2="540" y2="950" class="axis"/>
  
  <!-- 中心点 -->
  <circle cx="540" cy="540" r="10" class="center-dot"/>
  
  <!-- 上方：不忘 -->
  <text x="540" y="180" class="title" text-anchor="middle">不忘</text>
  <text x="540" y="220" class="subtitle" text-anchor="middle">悲喜镌入骨血</text>
  
  <!-- 下方：寻常 -->
  <text x="540" y="920" class="title" text-anchor="middle">寻常</text>
  <text x="540" y="880" class="subtitle" text-anchor="middle">烟火织就日常</text>
  
  <!-- 左方：荆棘 -->
  <text x="180" y="540" class="title" text-anchor="start" dominant-baseline="central">荆棘</text>
  <text x="180" y="590" class="subtitle" text-anchor="start">淬砺方成风骨</text>
  
  <!-- 右方：繁花 -->
  <text x="900" y="540" class="title" text-anchor="end" dominant-baseline="central">繁花</text>
  <text x="900" y="590" class="subtitle" text-anchor="end">圆满酿就荣光</text>
  
  <!-- 左上：荆棘 × 不忘 -->
  <text x="150" y="150" class="corner-title" text-anchor="start">荆棘 × 不忘</text>
  <text x="150" y="180" class="corner-subtitle" text-anchor="start">那些刺入生命的痛楚</text>
  
  <!-- 右上：繁花 × 不忘 -->
  <text x="930" y="150" class="corner-title" text-anchor="end">繁花 × 不忘</text>
  <text x="930" y="180" class="corner-subtitle" text-anchor="end">那些永远珍藏的美丽</text>
  
  <!-- 左下：荆棘 × 寻常 -->
  <text x="150" y="930" class="corner-title" text-anchor="start">荆棘 × 寻常</text>
  <text x="150" y="900" class="corner-subtitle" text-anchor="start">风波总会平息</text>
  
  <!-- 右下：繁花 × 寻常 -->
  <text x="930" y="930" class="corner-title" text-anchor="end">繁花 × 寻常</text>
  <text x="930" y="900" class="corner-subtitle" text-anchor="end">盛景亦是寻常</text>
</svg>