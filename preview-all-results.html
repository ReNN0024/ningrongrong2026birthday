<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16 种结果卡片预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f0f0f0; padding: 20px; font-family: sans-serif; }
h1 { text-align: center; margin-bottom: 20px; font-size: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
.card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.card svg { width: 100%; height: auto; display: block; }
.card-label { padding: 8px 12px; text-align: center; font-size: 14px; color: #666; background: #fafafa; border-top: 1px solid #eee; }
</style>
</head>
<body>
<h1>16 种结果卡片预览</h1>
<div class="grid" id="grid"></div>

<script src="share-card.js?v=20260728-09"></script>
<script>
const combos = [
  { main: 'R', tendency: 'thorn' }, { main: 'R', tendency: 'flower' }, { main: 'R', tendency: 'memory' }, { main: 'R', tendency: 'daily' },
  { main: 'O', tendency: 'thorn' }, { main: 'O', tendency: 'flower' }, { main: 'O', tendency: 'memory' }, { main: 'O', tendency: 'daily' },
  { main: 'N', tendency: 'thorn' }, { main: 'N', tendency: 'flower' }, { main: 'N', tendency: 'memory' }, { main: 'N', tendency: 'daily' },
  { main: 'G', tendency: 'thorn' }, { main: 'G', tendency: 'flower' }, { main: 'G', tendency: 'memory' }, { main: 'G', tendency: 'daily' },
];

const grid = document.getElementById('grid');

combos.forEach(({ main, tendency }) => {
  const result = window.ShareCard.PERSONALITY_RESULTS[`${main}-${tendency}`];
  const svg = window.ShareCard.buildSVG({
    main, tendency,
    title: result.title,
    description: result.description,
    placed: [],
    userId: '佚名',
  });

  const card = document.createElement('div');
  card.className = 'card';

  const svgEl = document.createElement('div');
  svgEl.innerHTML = svg;

  const label = document.createElement('div');
  label.className = 'card-label';
  label.textContent = `${main} · ${tendency} · ${result.title}`;

  card.appendChild(svgEl);
  card.appendChild(label);
  grid.appendChild(card);
});
</script>
</body>
</html>
